name: Deploy to Pages Branch

on:
  # 每次推送到 `master` 分支时触发这个"工作流程"
  # 如果你使用了别的分支名，请按需将 `master` 替换成你的分支名
  push:
    branches: [ master ]
  # 允许你在 GitHub 上的 Actions 标签中手动触发此"工作流程"
  workflow_dispatch:

# 需要写入权限来推送到pages分支
permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      # GitHub Pages 是纯静态托管：必须走 build:static。
      # 默认的 pnpm build 使用 @astrojs/vercel adapter，Astro 7 下静态产物落在 dist/client，
      # 直接部署 dist 会导致站点根目录没有 index.html（404）。
      # build:static 会临时移出 prerender=false 的动态路由、以 DEPLOY_TARGET=static 输出到 dist 根，结束后自动恢复。
      - name: Build site (static)
        run: pnpm run build:static

      - name: Create .nojekyll file
        run: touch dist/.nojekyll

      # pages 是「构建产物分支」，里面没有 package.json。Vercel 已连接本仓库并对每个分支
      # 自动触发部署，因此每次 pages 更新都会以 ERR_PNPM_NO_IMPORTER_MANIFEST_FOUND 失败。
      # 这里往产物里放一份 vercel.json，使 Vercel 评估 pages 分支的提交时读到
      # git.deploymentEnabled.pages=false 并跳过构建（Production 的 master 构建不受影响）。
      - name: Mark this branch as non-deployable on Vercel
        run: |
          cat > dist/vercel.json <<'JSON'
          {
            "$schema": "https://openapi.vercel.sh/vercel.json",
            "git": {
              "deploymentEnabled": {
                "pages": false
              }
            }
          }
          JSON
      
      - name: Deploy to pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: pages # 部署到pages分支
          folder: dist # Astro默认构建输出目录
          clean: true # 清理目标分支中的旧文件
